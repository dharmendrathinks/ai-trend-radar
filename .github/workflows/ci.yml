name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Check installed wheel and LLM assets
        shell: bash
        run: |
          wheels=(dist/*.whl)
          uv run --isolated --no-project --with "${wheels[0]}" python -c 'from ai_trend_radar.llm_adapter import HERE, validate_model; assert (HERE / "prompt.md").is_file(); assert validate_model({"angles": [], "abstain_reason": "Smoke check"}, {"notes": ""}) == ([], [])'
          uv run --isolated --no-project --with "${wheels[0]}" ai-trend-radar scan --help
